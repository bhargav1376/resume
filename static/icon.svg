<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31108c" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="lineGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="lineGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="5" />

  <!-- Radial Glow Behind Document -->
  <circle cx="256" cy="240" r="150" fill="#6366f1" opacity="0.4" filter="url(#glow)" />

  <!-- Document Card -->
  <g transform="translate(110, 80)">
    <!-- Document Surface -->
    <rect x="0" y="0" width="255" height="340" rx="26" fill="url(#docGrad)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="3" />

    <!-- Avatar Icon Box -->
    <rect x="30" y="32" width="48" height="48" rx="14" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <circle cx="54" cy="50" r="10" fill="#a5b4fc" />
    <path d="M 40 72 C 40 62 68 62 68 72 Z" fill="#818cf8" />

    <!-- "YOUR JOB" Text Header -->
    <text x="90" y="62" font-family="'Inter', 'Roboto', system-ui, sans-serif" font-weight="900" font-size="21" fill="#ffffff" letter-spacing="1">YOUR JOB</text>

    <!-- Resume Line Bars -->
    <rect x="30" y="100" width="195" height="12" rx="6" fill="url(#lineGrad1)" />
    <rect x="30" y="124" width="150" height="10" rx="5" fill="rgba(255,255,255,0.4)" />

    <rect x="30" y="152" width="195" height="12" rx="6" fill="url(#lineGrad2)" />
    <rect x="30" y="176" width="170" height="10" rx="5" fill="rgba(255,255,255,0.4)" />

    <rect x="30" y="204" width="195" height="12" rx="6" fill="url(#lineGrad3)" />
    <rect x="30" y="228" width="180" height="10" rx="5" fill="rgba(255,255,255,0.4)" />

    <rect x="30" y="256" width="195" height="12" rx="6" fill="url(#lineGrad4)" />
    <rect x="30" y="280" width="140" height="10" rx="5" fill="rgba(255,255,255,0.4)" />
  </g>

  <!-- Glowing 3D AI Sparkle Star ✨ -->
  <g transform="translate(340, 210)" filter="url(#starGlow)">
    <path d="M 0 -60 Q 0 0 60 0 Q 0 0 0 60 Q 0 0 -60 0 Q 0 0 0 -60 Z" fill="url(#starGrad)" />
    <circle cx="0" cy="0" r="12" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Small "B" Badge in Bottom Right Corner -->
  <g transform="translate(355, 355)">
    <circle cx="45" cy="45" r="42" fill="url(#bBadgeGrad)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="4" filter="url(#glow)" />
    <text x="45" y="58" font-family="'Inter', 'Outfit', system-ui, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle">B</text>
  </g>
</svg>
